name: CI

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome check
        run: bun run check
      - name: TypeScript typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun test --pass-with-no-tests
      - name: Build default gallery
        run: PUBLIC_URL=gallery VITE_DATA_FOLDER=data bun run build -- --base=/gallery
      - name: Build regional gallery (NAC)
        run: PUBLIC_URL=galleryNAC VITE_DATA_FOLDER=dataNAC bun run build -- --base=/galleryNAC
